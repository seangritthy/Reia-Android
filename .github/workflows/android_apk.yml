name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LFS assets are pulled
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull || true

      - name: Setup export template paths and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.6.stable \
             ~/.local/share/godot/export_templates/4.6.stable || true

          # Find Android SDK and Java SDK paths in container
          ANDROID_SDK=""
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/root/android-sdk" "/usr/lib/android-sdk" "/usr/local/lib/android/sdk"; do
            if [ -n "$p" ] && [ -d "$p" ]; then ANDROID_SDK="$p"; break; fi
          done

          JAVA_PATH=""
          if command -v java >/dev/null 2>&1; then
            JAVA_PATH=$(readlink -f "$(which java)" | sed 's|/bin/java||')
          fi
          if [ -z "$JAVA_PATH" ] || [ ! -d "$JAVA_PATH" ]; then
            for p in "$JAVA_HOME" "/usr/lib/jvm/java-17-openjdk-amd64" "/usr/lib/jvm/default-java"; do
              if [ -n "$p" ] && [ -d "$p" ]; then JAVA_PATH="$p"; break; fi
            done
          fi

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi

          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_SDK" "$JAVA_PATH" "$HOME" > ~/.config/godot/editor_settings-4.6.tres
          echo "Configured Godot Editor Settings:"
          cat ~/.config/godot/editor_settings-4.6.tres

      - name: Export Android APK
        run: |
          mkdir -p build/android
          cd godot
          godot --headless --verbose --export-release "android" ../build/android/Reia-Android.apk || true
          if [ ! -f ../build/android/Reia-Android.apk ]; then
            echo "Export failed: APK was not generated."
            exit 1
          fi

      - name: ZipAlign & Sign APK for Android Compatibility
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools/ -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          
          # Align shared libraries on 4-byte page boundaries required by Android 11+
          $BUILD_TOOLS_DIR/zipalign -p -f 4 build/android/Reia-Android.apk build/android/Reia-Android-aligned.apk
          mv build/android/Reia-Android-aligned.apk build/android/Reia-Android.apk
          
          # Sign APK with v2 + v3 schemes
          $BUILD_TOOLS_DIR/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey build/android/Reia-Android.apk
          
          # Verify alignment and signature schemes
          $BUILD_TOOLS_DIR/zipalign -c -v 4 build/android/Reia-Android.apk
          $BUILD_TOOLS_DIR/apksigner verify -v build/android/Reia-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reia-Android-APK
          path: build/android/Reia-Android.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/Reia-Android.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.5.1' }}
          name: Reia Android Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.5.1' }}
          body: "Automated Android APK Release for Reia-Android"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

