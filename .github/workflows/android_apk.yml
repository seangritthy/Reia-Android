name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure LFS assets are pulled
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull || true

      - name: Setup export template paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/4.6.stable \
             ~/.local/share/godot/export_templates/4.6.stable || true

      - name: Export Android APK
        run: |
          mkdir -p build/android
          cd godot
          godot --headless --verbose --export-release "android" ../build/android/Reia-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reia-Android-APK
          path: build/android/Reia-Android.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/Reia-Android.apk
          tag_name: v1.0.0-android
          draft: false
          prerelease: false
